name: Auto-merge development into main

on:
  release:
    types: [published]  # triggers whenever a release is published

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      # Checkout the main branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # needed to fetch full history for merge

      # Configure git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fetch latest development branch
      - name: Fetch development branch
        run: git fetch origin development:development

      # Merge development into main
      - name: Merge development into main
        run: |
          git checkout main
          git merge --no-ff origin/development -m "chore: merge development into main after release"

      # Push merged changes back to remote
      - name: Push changes
        run: git push origin main

      # Optional: Notify in GitHub if merge fails
      - name: Merge status
        if: failure()
        run: echo "⚠️ Merge failed! Please resolve conflicts manually."
